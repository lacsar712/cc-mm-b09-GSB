<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>矿井瓦斯班测台</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #1c1917; color: #f5f5f4; }
    header { display: flex; gap: 12px; align-items: center; padding: 12px 20px; background: #44403c; flex-wrap: wrap; }
    header nav { display: flex; gap: 4px; }
    header nav button { background: #57534e; color: #f5f5f4; border: 0; padding: 6px 14px; cursor: pointer; border-radius: 4px; }
    header nav button.on { background: #d97706; }
    #who { color: #d6d3d1; }
    main { max-width: 860px; margin: 20px auto; padding: 0 12px; }
    input, button { padding: 8px; margin-right: 8px; }
    .alarm { color: #fca5a5; } .ok { color: #86efac; }
    #live { min-height: 1.4em; }
    table { width: 100%; border-collapse: collapse; }
    td, th { border-bottom: 1px solid #57534e; padding: 6px; text-align: left; }
    .muted { color: #a8a29e; }
    .bar { background: #292524; border: 1px solid #57534e; border-radius: 6px; padding: 10px 12px; margin-bottom: 14px; }
    .bar input { width: 90px; }
    .badge { font-size: 12px; color: #fbbf24; border: 1px solid #fbbf24; border-radius: 4px; padding: 1px 6px; margin-left: 6px; }
    section[hidden] { display: none; }
  </style>
</head>
<body>
  <header>
    <strong>矿井瓦斯班测台</strong>
    <nav id="tabs" hidden>
      <button data-page="records" class="on">班测记录</button>
      <button data-page="live">现场可疑</button>
      <button data-page="ledger">可疑册</button>
    </nav>
    <span id="who"></span>
    <button id="out" hidden>退出</button>
  </header>
  <main>
    <section id="login">
      <p>检查员上报测点甲烷，达到 1% 会立刻推到已打开的页。这不是图表看板。</p>
      <input id="user" value="gasman" />
      <input id="pass" type="password" value="gas123456" />
      <button id="go">登录</button>
      <p class="muted">gasman / gas123456 可上报、可改粘滞门槛；viewer / view123456 只能看</p>
    </section>

    <section id="app" hidden>
      <p id="live">等待推送</p>

      <div id="page-records">
        <form id="form">
          <input id="site" placeholder="测点" />
          <input id="ch4" type="number" step="0.01" placeholder="甲烷 %" />
          <button>上报</button>
        </form>
        <table><thead><tr><th>测点</th><th>甲烷 %</th><th>状态</th><th>说明</th></tr></thead><tbody id="rows"></tbody></table>
      </div>

      <div id="page-live" hidden>
        <div class="bar">
          <label>粘滞门槛：</label>
          <input id="threshold" type="number" step="0.001" min="0" />
          <button id="save-threshold">保存门槛</button>
          <span id="threshold-hint" class="muted"></span>
        </div>
        <p class="muted">同一测点时间相邻两笔，浓度差绝对值 &lt; 当前门槛即列出现场可疑；改门槛后本页立即重算。</p>
        <table>
          <thead><tr><th>测点</th><th>前笔 #</th><th>本笔 #</th><th>前笔浓度</th><th>本笔浓度</th><th>差值</th></tr></thead>
          <tbody id="live-rows"></tbody>
        </table>
      </div>

      <div id="page-ledger" hidden>
        <p class="muted">可疑册在检出当时冻结：门槛、前后两笔主键、差值与写入时刻都保持检出时的原文，之后改门槛不影响旧册行。</p>
        <table>
          <thead><tr><th>测点</th><th>冻结门槛</th><th>前笔 #</th><th>本笔 #</th><th>前笔浓度</th><th>本笔浓度</th><th>冻结差值</th><th>检出人</th><th>写入时刻</th></tr></thead>
          <tbody id="ledger-rows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
